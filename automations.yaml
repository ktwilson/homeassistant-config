- id: 'daily_status_check'
  alias: "Daily 8am Status Check"
  trigger:
    - platform: time
      at: "08:00:00"
  action:
    - action: notify.send_message
      target:
        entity_id: notify.pixel_9a
      data:
        title: "Homelab Status - {{ now().strftime('%-m/%-d') }}"
        message: >-
          Garage: {{ states('sensor.garage_door_status') }}
          Shop: {{ states('sensor.shop_door_status') }}
          Docker (hp260g3): {{ states('sensor.homelab_docker_status') }}
          DELLWS: {{ states('sensor.dellws_process_status') }}
          AC Power: {{ states('sensor.ac_power_status') }}
  mode: single

- id: 'pc_inactivity_alert'
  alias: "PC Inactivity Alert"
  description: >-
    Checks every 15 minutes whether kevin_pc_last_activity has gone 8+
    hours without an update (i.e. UserMonitor hasn't logged any
    keyboard/mouse activity) - the wellness check. Uses a periodic check
    plus an elapsed-time condition rather than a state "for:" trigger -
    testing showed a state+for trigger on this entity didn't reliably
    fire (last_triggered stayed None well past the test threshold, with
    no errors logged), so this more explicit pattern replaces it. Only
    alerts once per inactivity episode via pc_inactivity_alerted, which
    pc_activity_heartbeat resets whenever fresh activity arrives.
    Notifies both Kevin's own phone (push, for visibility) and a real
    SMS via email-to-SMS gateway to whoever should actually check on
    him, since that person won't have Home Assistant installed.
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: template
      value_template: >-
        {{ (as_timestamp(now()) - as_timestamp(states.input_datetime.kevin_pc_last_activity.last_changed)) >= 8 * 3600 }}
    - condition: state
      entity_id: input_boolean.pc_inactivity_alerted
      state: "off"
  action:
    - action: notify.send_message
      target:
        entity_id: notify.pixel_9a
      data:
        title: "No PC activity in 8 hours"
        message: >-
          Kevin's PC has shown no keyboard/mouse activity since
          {{ states('input_datetime.kevin_pc_last_activity') }}.
    - action: notify.send_message
      target:
        entity_id: notify.sms_via_email_3306977793_msg_fi_google_com
      data:
        title: "Wellness Check"
        message: >-
          Kevin's PC has shown no activity since
          {{ states('input_datetime.kevin_pc_last_activity') }}. Please check on him.
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pc_inactivity_alerted
  mode: single

- id: 'osu_game_tv_on'
  alias: "TV On Before Ohio State Games"
  description: >-
    Turns the living room TV on 15 minutes before each Ohio State football
    kickoff (sensor.ohio_state_next_kickoff, from the ESPN schedule API)
    and opens YouTube TV. Uses the Chromecast with Google TV via Android
    TV Remote; powering it on wakes the Hisense over HDMI-CEC.
  trigger:
    - platform: time
      at:
        entity_id: sensor.ohio_state_next_kickoff
        offset: "-00:15:00"
  action:
    - action: media_player.turn_on
      target:
        entity_id: media_player.living_room_tv2_2
    - delay: "00:00:10"
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room_tv2_2
      data:
        media_content_type: app
        media_content_id: com.google.android.youtube.tvunplugged
  mode: single
